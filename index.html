<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#14532d" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Farm" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <title>Farm Manager</title>

  <!-- Tailwind CSS via CDN (no build step) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Design tokens: high-contrast, outdoor-readable, touch-first.
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            farm: {
              green: '#14532d',   // primary brand / header
              greenLight: '#16a34a',
              cream: '#fefce8',   // page background
              ink: '#1c1917',     // primary text (near-black)
              urgent: '#b91c1c',  // urgent red
              amber: '#b45309',   // warning amber
            },
          },
          minHeight: {
            touch: '44px', // minimum touch target
          },
          fontSize: {
            base: ['1.0625rem', '1.6'], // slightly larger base for outdoor readability
          },
        },
      },
    };
  </script>

  <style>
    /* Base readability + touch rules that Tailwind utilities don't cover. */
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans Devanagari', sans-serif;
      background-color: #fefce8;
      color: #1c1917;
    }
    /* Every interactive element gets a minimum 44px touch target. */
    button, [role="button"], a, input, select, textarea {
      min-height: 44px;
      touch-action: manipulation;
    }
    /* Visible focus state for accessibility. */
    :focus-visible {
      outline: 3px solid #16a34a;
      outline-offset: 2px;
    }
    /* Pulsing animation reserved for urgent alerts (used from Phase 7). */
    @keyframes urgent-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }
    .animate-urgent { animation: urgent-pulse 1s ease-in-out infinite; }
    /* Screen-reader only text (accessibility). */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col">
  <!-- ===================== TOP BAR ===================== -->
  <header class="bg-farm-green text-white shadow-md sticky top-0 z-40">
    <div class="max-w-5xl mx-auto flex items-center gap-2 px-3 py-2">
      <!-- App title -->
      <h1 id="app-title" class="text-lg font-bold tracking-wide flex-1 truncate">
        Farm Manager
      </h1>

      <!-- Role status badge (populated after login; hidden pre-auth) -->
      <span id="role-badge"
            class="hidden text-xs font-semibold uppercase tracking-wider bg-white/20 rounded-full px-3 py-1.5">
      </span>

      <!-- Offline / sync indicator dot -->
      <span id="sync-indicator"
            class="flex items-center gap-1.5 text-xs font-medium"
            aria-live="polite">
        <span id="sync-dot" class="inline-block w-3 h-3 rounded-full bg-gray-300" aria-hidden="true"></span>
        <span id="sync-label" class="hidden sm:inline">—</span>
        <span id="sync-sr" class="sr-only">—</span>
      </span>

      <!-- Bilingual switcher -->
      <button id="lang-toggle"
              type="button"
              class="bg-white/20 hover:bg-white/30 rounded-full px-4 py-1.5 text-sm font-bold transition-colors"
              aria-label="Switch language">
        नेपाली
      </button>

      <!-- Logout (hidden until authenticated) -->
      <button id="logout-btn"
              type="button"
              class="hidden bg-white/20 hover:bg-white/30 rounded-full px-4 py-1.5 text-sm font-bold transition-colors">
        Logout
      </button>
    </div>
  </header>

  <!-- ===================== URGENT ALERT BANNER ===================== -->
  <div id="alert-host" class="sticky top-[60px] z-30"></div>

  <!-- ===================== MAIN VIEW ===================== -->
  <main id="view-container" class="flex-1 w-full max-w-5xl mx-auto p-4">
    <!-- Views render here via the hash router -->
  </main>

  <!-- ===================== MODAL HOST ===================== -->
  <div id="modal-host" class="hidden fixed inset-0 z-50"></div>

  <!-- ===================== BOOT ===================== -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
